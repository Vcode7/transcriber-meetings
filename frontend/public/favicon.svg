  </defs>
  <!-- Background rounded card -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)" stroke="#4338ca" stroke-width="1.2" />
  <!-- Waveform audio bars -->
  <rect x="6" y="12" width="2.6" height="8" rx="1.3" fill="url(#wave)" />
  <rect x="10.8" y="8" width="2.6" height="16" rx="1.3" fill="url(#wave)" />
  <rect x="15.6" y="5" width="2.6" height="22" rx="1.3" fill="url(#wave)" />
  <rect x="20.4" y="9" width="2.6" height="14" rx="1.3" fill="url(#wave)" />
  <rect x="25.2" y="13" width="2.6" height="6" rx="1.3" fill="url(#wave)" />
</svg>
